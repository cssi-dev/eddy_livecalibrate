# =============================================================================
# eddy_livecalibrate.cfg  --  CALIBRATE_Z_CENTER
# =============================================================================
#
# Live Z-center calibration for an eddy-current probe (e.g. BTT Eddy).
#
# It probes two points and uses the difference to set a live gcode Z offset:
#
#   A = a reference position (near the gantry / endstop side of the bed)
#   B = the bed center
#
# The applied offset is:
#
#   z_offset = z_a - z_b + z_adjust
#
# where z_a / z_b are the probe's reported trigger heights at A and B, and
# z_adjust is a fixed fine-tune term for your specific bed/nozzle. Probing both
# points just before a print lets the offset track frame/gantry thermal drift
# instead of relying on a single cold calibration.
#
# -----------------------------------------------------------------------------
# REQUIREMENTS
#   * An eddy-current (or any) probe exposing `printer.probe.last_z_result`
#     after a bare `PROBE` command.
#   * The machine must be homed and any gantry-leveling (QGL / Z_TILT) done
#     before calling this, so the two probe points are meaningful.
#
# USAGE
#   Call once in your print-start sequence, after homing + leveling + mesh:
#
#       CALIBRATE_Z_CENTER
#
#   Optional params (defaults shown are for a 350mm Voron-style bed; CHANGE
#   THEM to match your machine):
#
#       POS_A_X / POS_A_Y   reference probe point   (default 175, 295)
#       POS_B_X / POS_B_Y   bed-center probe point  (default 175, 175)
#       PROBE_Z             travel/probe-start Z    (default 3)
#       Z_ADJUST            fine-tune offset        (default -0.815)
#
#   e.g.  CALIBRATE_Z_CENTER POS_A_X=175 POS_A_Y=295 Z_ADJUST=-0.80
#
# TUNING Z_ADJUST
#   Positive moves the nozzle AWAY from the bed (looser first layer);
#   negative moves it CLOSER. Start from your known-good single-point offset
#   and adjust in ~0.02mm steps from a first-layer test.
#
# NOTE
#   The default Z_ADJUST=-0.815 is specific to the author's machine. It is NOT
#   a universal value -- you must calibrate your own.
# =============================================================================


[gcode_macro CALIBRATE_Z_CENTER]
variable_z_a: 0.0
variable_z_b: 0.0
variable_z_adjust: 0.0
gcode:
    {% set pos_a_x  = params.POS_A_X|default(175)|float %}
    {% set pos_a_y  = params.POS_A_Y|default(295)|float %}
    {% set pos_b_x  = params.POS_B_X|default(175)|float %}
    {% set pos_b_y  = params.POS_B_Y|default(175)|float %}
    {% set probe_z  = params.PROBE_Z|default(3)|float %}
    # Fine-tune: positive moves nozzle away from bed, negative moves it closer
    #{% set z_adjust = params.Z_ADJUST|default(-0.15)|float %} #Voron Bed old
    {% set z_adjust = params.Z_ADJUST|default(-0.815)|float %} #Voron Bed
    SET_GCODE_VARIABLE MACRO=CALIBRATE_Z_CENTER VARIABLE=z_adjust VALUE={z_adjust}
    # Probe at A, then hand off to _CALIBRATE_Z_SAVE_A to read the result
    M117 Probing at endstop pos (A)...
    G90
    G0 X{pos_a_x} Y{pos_a_y} Z{probe_z} F3000
    M400
    PROBE
    _CALIBRATE_Z_SAVE_A POS_B_X={pos_b_x} POS_B_Y={pos_b_y} PROBE_Z={probe_z}


[gcode_macro _CALIBRATE_Z_SAVE_A]
gcode:
    {% set pos_b_x = params.POS_B_X|float %}
    {% set pos_b_y = params.POS_B_Y|float %}
    {% set probe_z = params.PROBE_Z|float %}
    {% set z_a = printer.probe.last_z_result %}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_Z_CENTER VARIABLE=z_a VALUE={z_a}
    { action_respond_info("CALIBRATE_Z_CENTER: Z at endstop pos A = %.4f" % z_a) }
    # Now probe at B, then hand off to _CALIBRATE_Z_APPLY to compute offset
    M117 Probing at bed center (B)...
    G90
    G0 X{pos_b_x} Y{pos_b_y} Z{probe_z} F3000
    M400
    PROBE
    _CALIBRATE_Z_APPLY


[gcode_macro _CALIBRATE_Z_APPLY]
gcode:
    {% set z_a = printer["gcode_macro CALIBRATE_Z_CENTER"].z_a %}
    {% set z_b = printer.probe.last_z_result %}
    {% set z_adjust = printer["gcode_macro CALIBRATE_Z_CENTER"].z_adjust %}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_Z_CENTER VARIABLE=z_b VALUE={z_b}
    { action_respond_info("CALIBRATE_Z_CENTER: Z at bed center B = %.4f" % z_b) }
    {% set z_offset = z_a - z_b + z_adjust %}
    { action_respond_info("CALIBRATE_Z_CENTER: applying Z offset = %.4f (A=%.4f B=%.4f adjust=%.4f)" % (z_offset, z_a, z_b, z_adjust)) }
    SET_GCODE_OFFSET Z={z_offset} MOVE=0
    M117 Z center offset: {z_offset}
    G0 Z10 F1000
    M400
